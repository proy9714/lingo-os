[project]
name = "lingo-os"
version = "0.1.0"
description = "Lingo OS backend: local-first language immersion system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
]

[project.scripts]
lingo = "app.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
