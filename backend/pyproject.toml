[project]
name = "lingo-os"
version = "0.4.0"
description = "Lingo OS backend: local-first language immersion system"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "spacy>=3.8,<3.9",
  "fugashi>=1.5",
  "unidic-lite>=1.0.8",
  "wordfreq>=3.1",
  "de-core-news-sm",
  "es-core-news-sm",
  "yt-dlp[default]>=2026.10.26",
  "pypdf>=5",
  "trafilatura>=2",
  "python-multipart>=0.0.12",
  "cryptography>=44",
  "edge-tts>=7.3.1",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.4",
  "spacy-pkuseg>=1.0,<2",
  "pypinyin>=0.55",
  "anthropic>=2.13.0",
  "faster-whisper>=1.1",
]

[project.scripts]
lingo = "app.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
