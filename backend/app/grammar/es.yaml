          - ["1–10", "uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez"]
          - ["11–20", "once, doce, trece, catorce, quince, dieciséis, diecisiete, dieciocho, diecinueve, veinte"]
          - ["tens", "treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien"]
          - ["21, 35, 99", "veintiuno, treinta y cinco, noventa y nueve"]
          - ["hundreds", "ciento uno, doscientos, quinientos, setecientos, novecientos, mil"]
          - ["days", "lunes, martes, miércoles, jueves, viernes, sábado, domingo | el lunes = on Monday; los lunes = on Mondays"]
          - ["months", "enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre | no capital letters"]
      - caption: Telling the time
        head: ["Clock", "Spanish", "Meaning"]
