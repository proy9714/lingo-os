# Spanish grammar reference, beginner to intermediate. Shown on the Grammar page.
# Cells: "target | translation"; several in one cell are separated by " ;; "; {…} marks an ending to highlight.
# Examples: [sentence, translation, optional note].  kind: structure | verbs | contrast | summary

language: es
title: Spanish grammar
intro: >-
  A working reference for beginners to intermediate learners. Every pattern comes with real sentences and a translation:
  read a section, notice the shape, then listen for it in what you watch and read.

sections:
  - id: nouns
    title: Nouns, articles & gender
    kind: structure
    level: A1
    tags: [gender, article, el, la, plural, noun]
    tables:
      - head: ["", "Definite", "Indefinite"]
        rows:
          - ["masculine", "el libro | the book", "un libro | a book"]
          - ["feminine", "la mesa | the table", "una mesa | a table"]
          - ["masculine plural", "los libros | the books", "unos libros | some books"]
          - ["feminine plural", "las mesas | the tables", "unas mesas | some tables"]
    text: >-
      Most nouns in **-o** are masculine and most in **-a** are feminine. **-ción, -sión, -dad, -tad, -tud** are feminine
      (la canción, la ciudad); many words in **-ma** from Greek are masculine (el problema, el idioma, el tema). Common
      exceptions: el día, el mapa, la mano, la foto, la radio. Plurals: vowel + **-s** (casas), consonant + **-es**
      (ciudades), -z → **-ces** (luz → luces). **a + el = al**, **de + el = del**. Feminine nouns starting with a stressed a-
      take el in the singular: **el agua**, el águila (but las aguas).
    examples:
      - ["La ciudad es muy bonita.", "The city is very pretty."]
      - ["Tengo un problema.", "I have a problem.", "el problema: masculine despite the -a"]
      - ["Vamos al mercado.", "We're going to the market.", "a + el = al"]
      - ["El agua está fría.", "The water is cold.", "agua is feminine, so fría"]

  - id: pronouns
    title: Pronouns & dropping the subject
    kind: structure
    level: A1
    tags: [pronoun, pronouns, yo, tú, usted, vosotros, ustedes]
    tables:
      - head: ["Meaning", "Subject", "Direct object", "Indirect object", "After a preposition"]
        rows:
          - ["I / me", "yo", "me", "me", "mí (conmigo)"]
          - ["you (informal)", "tú", "te", "te", "ti (contigo)"]
          - ["he / him", "él", "lo", "le", "él"]
          - ["she / her", "ella", "la", "le", "ella"]
          - ["you (formal)", "usted", "lo / la", "le", "usted"]
          - ["we / us", "nosotros / nosotras", "nos", "nos", "nosotros"]
          - ["you all (Spain, informal)", "vosotros / vosotras", "os", "os", "vosotros"]
          - ["they / you all", "ellos / ellas / ustedes", "los / las", "les", "ellos / ellas / ustedes"]
    text: >-
      The verb ending already shows who is acting, so the subject pronoun is usually left out: **Vivo en Madrid.** Say it
      for emphasis or contrast. In Latin America **ustedes** is the only plural "you"; **vosotros** is used in Spain.
      Usted and ustedes take the third-person verb form.
    examples:
      - ["Vivo en Madrid.", "I live in Madrid.", "no yo needed"]
      - ["Yo trabajo y tú descansas.", "I work and you rest.", "pronouns for contrast"]
      - ["¿Vienes conmigo?", "Are you coming with me?"]

  - id: present
    title: Present tense (regular verbs)
    kind: verbs
    level: A1
    tags: [present, presente, conjugation, -ar, -er, -ir]
    rule: Drop -ar, -er or -ir and add the ending for the person.
    tables:
      - head: ["Person", "hablar | to speak", "comer | to eat", "vivir | to live"]
        rows:
          - ["yo", "habl{o}", "com{o}", "viv{o}"]
          - ["tú", "habl{as}", "com{es}", "viv{es}"]
          - ["él / ella / usted", "habl{a}", "com{e}", "viv{e}"]
          - ["nosotros", "habl{amos}", "com{emos}", "viv{imos}"]
          - ["vosotros", "habl{áis}", "com{éis}", "viv{ís}"]
          - ["ellos / ellas / ustedes", "habl{an}", "com{en}", "viv{en}"]
    text: >-
      The present covers habits, facts and plans for the near future. For "right now", use **estar + gerund**
      (-ando / -iendo): estoy comiendo, está lloviendo.
    examples:
      - ["Hablo un poco de español.", "I speak a little Spanish."]
      - ["¿Dónde vives?", "Where do you live?"]
      - ["Mañana comemos con mis padres.", "Tomorrow we're having lunch with my parents.", "the present for a plan"]
      - ["Estoy leyendo un libro.", "I'm reading a book (right now)."]

  - id: ser-estar
    title: ser vs. estar
    kind: contrast
    level: A1
    tags: [ser, estar, to be]
    tables:
      - head: ["", "ser", "estar"]
        rows:
          - ["Forms", "soy, eres, es, somos, sois, son", "estoy, estás, está, estamos, estáis, están"]
          - ["Use", "what something is: identity, origin, job, character, time, material, where an event takes place", "how or where something is: state, mood, location, result"]
          - ["Examples", "Ella es médica. | She's a doctor. ;; Son las tres. | It's three o'clock.", "Estoy cansado. | I'm tired. ;; El banco está en la plaza. | The bank is on the square."]
    text: >-
      Some adjectives change meaning: **ser aburrido** (boring) / **estar aburrido** (bored); **ser listo** (clever) /
      **estar listo** (ready); **ser rico** (rich) / **estar rico** (tasty); **ser malo** (bad) / **estar malo** (ill).
    examples:
      - ["Soy de India, pero estoy en Madrid.", "I'm from India, but I'm in Madrid."]
      - ["La sopa está muy rica.", "The soup is delicious.", "estar rico = tasty"]
      - ["La fiesta es en mi casa.", "The party is at my place.", "events take ser"]

  - id: irregular
    title: Essential irregular verbs
    kind: verbs
    level: A1
    tags: [irregular, ir, tener, hacer, poder, querer, decir]
    tables:
      - head: ["Verb", "yo", "tú", "él / usted", "nosotros", "vosotros", "ellos / ustedes"]
        rows:
          - ["ir | to go", "voy", "vas", "va", "vamos", "vais", "van"]
          - ["tener | to have", "tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]
          - ["hacer | to do, make", "hago", "haces", "hace", "hacemos", "hacéis", "hacen"]
          - ["poder | can", "puedo", "puedes", "puede", "podemos", "podéis", "pueden"]
          - ["querer | to want", "quiero", "quieres", "quiere", "queremos", "queréis", "quieren"]
          - ["decir | to say", "digo", "dices", "dice", "decimos", "decís", "dicen"]
          - ["venir | to come", "vengo", "vienes", "viene", "venimos", "venís", "vienen"]
          - ["saber | to know", "sé", "sabes", "sabe", "sabemos", "sabéis", "saben"]
          - ["dar | to give", "doy", "das", "da", "damos", "dais", "dan"]
          - ["salir | to go out", "salgo", "sales", "sale", "salimos", "salís", "salen"]
    text: >-
      Many verbs are irregular only in the yo form: **hago, salgo, pongo, traigo, conozco, veo**.
    examples:
      - ["Tengo veinte años.", "I'm twenty.", "age uses tener"]
      - ["¿Qué haces esta noche?", "What are you doing tonight?"]
      - ["No sé dónde está.", "I don't know where it is."]

  - id: stem-change
    title: Stem-changing verbs
    kind: verbs
    level: A1–A2
    tags: [stem-changing, e-ie, o-ue, e-i, boot verbs]
    rule: The stressed vowel of the stem changes in every form except nosotros and vosotros.
    tables:
      - head: ["", "e → ie: pensar | to think", "o → ue: dormir | to sleep", "e → i: pedir | to ask for"]
        rows:
          - ["yo", "p{ie}nso", "d{ue}rmo", "p{i}do"]
          - ["tú", "p{ie}nsas", "d{ue}rmes", "p{i}des"]
          - ["él / usted", "p{ie}nsa", "d{ue}rme", "p{i}de"]
          - ["nosotros", "pensamos", "dormimos", "pedimos"]
          - ["vosotros", "pensáis", "dormís", "pedís"]
          - ["ellos / ustedes", "p{ie}nsan", "d{ue}rmen", "p{i}den"]
    text: >-
      Other common ones: **e → ie** empezar, querer, preferir, entender, cerrar; **o → ue** poder, volver, encontrar,
      costar, recordar (and **jugar: u → ue**); **e → i** servir, repetir, seguir, vestir.
    examples:
      - ["¿Cuánto cuesta?", "How much does it cost?", "costar: o → ue"]
      - ["Prefiero el té.", "I prefer tea."]
      - ["Juego al fútbol los sábados.", "I play football on Saturdays.", "jugar: u → ue"]

  - id: gustar
    title: gustar and verbs like it
    kind: structure
    level: A1–A2
    tags: [gustar, encantar, doler, like, indirect object]
    rule: "Literally \"it pleases me\": the verb agrees with the thing liked, and the person is an indirect object."
    tables:
      - head: ["Who likes it", "Pronoun", "One thing / a verb", "Several things"]
        rows:
          - ["(a mí) | I", "me", "me gusta el café", "me gustan los perros"]
          - ["(a ti) | you", "te", "te gusta bailar", "te gustan"]
          - ["(a él / ella / usted)", "le", "le gusta", "le gustan"]
          - ["(a nosotros)", "nos", "nos gusta", "nos gustan"]
          - ["(a vosotros)", "os", "os gusta", "os gustan"]
          - ["(a ellos / ustedes)", "les", "les gusta", "les gustan"]
    text: >-
      The same pattern: **encantar** (love), **interesar**, **importar**, **doler** (hurt), **faltar** (be missing),
      **parecer** (seem). Add **a + name** to make le/les clear: A Ana le gusta leer.
    examples:
      - ["Me gustan las películas de terror.", "I like horror films."]
      - ["¿Te gusta bailar?", "Do you like dancing?"]
      - ["A mi madre le encanta el jardín.", "My mother loves the garden."]
      - ["Me duele la cabeza.", "I have a headache.", "doler works like gustar"]

  - id: object-pronouns
    title: Object pronouns
    kind: structure
    level: A2
    tags: [object pronouns, lo, la, le, se lo, direct object, indirect object]
    tables:
      - head: ["", "Direct object", "Indirect object"]
        rows:
          - ["me", "me", "me"]
          - ["you (tú)", "te", "te"]
          - ["him, it, you (usted, masc.)", "lo", "le"]
          - ["her, it, you (usted, fem.)", "la", "le"]
          - ["us", "nos", "nos"]
          - ["you all (vosotros)", "os", "os"]
          - ["them, you all (ustedes)", "los / las", "les"]
    text: >-
      They go **before** a conjugated verb (Lo veo) and are **attached** to infinitives, gerunds and positive commands
      (quiero verlo, estoy mirándolo, ¡cómpralo!). With two pronouns, the indirect comes first (me lo das), and
      **le / les become se** before lo, la, los, las: **se lo doy**.
    examples:
      - ["¿El libro? Lo tengo aquí.", "The book? I have it here."]
      - ["Te llamo mañana.", "I'll call you tomorrow."]
      - ["Se lo explico a mi hermano.", "I'm explaining it to my brother.", "le lo → se lo"]
      - ["¿Me lo puedes enviar?", "Can you send it to me?", "also: ¿Puedes enviármelo?"]

  - id: reflexive
    title: Reflexive verbs
    kind: verbs
    level: A2
    tags: [reflexive, me, te, se, llamarse, irse]
    tables:
      - head: ["", "levantarse | to get up"]
        rows:
          - ["yo", "me levanto"]
          - ["tú", "te levantas"]
          - ["él / usted", "se levanta"]
          - ["nosotros", "nos levantamos"]
          - ["vosotros", "os levantáis"]
          - ["ellos / ustedes", "se levantan"]
    text: >-
      Daily routine verbs are reflexive: despertarse, ducharse, vestirse, acostarse. Some change meaning:
      **ir** (go) / **irse** (leave), **dormir** (sleep) / **dormirse** (fall asleep), **llamar** (call) /
      **llamarse** (be called). With body parts, use the article, not a possessive: Me lavo **las** manos.
    examples:
      - ["Me llamo Carlos.", "My name is Carlos."]
      - ["Nos vamos a las ocho.", "We're leaving at eight.", "irse = leave"]
      - ["¿A qué hora te acuestas?", "What time do you go to bed?"]

  - id: adjectives
    title: Adjectives
    kind: structure
    level: A1
    tags: [adjective, agreement, position, buen]
    tables:
      - head: ["Ending", "Masculine", "Feminine"]
        rows:
          - ["-o", "un chico alto | a tall boy", "una chica alta | a tall girl"]
          - ["-e or a consonant", "un coche grande / azul", "una casa grande / azul"]
          - ["nationality, -or", "un hombre español, trabajador", "una mujer española, trabajadora"]
          - ["plural", "chicos altos, coches azules", "chicas altas, casas azules"]
    text: >-
      Adjectives agree with the noun and usually come **after** it: una casa blanca. A few go before and change meaning:
      **un gran hombre** (a great man) vs. **un hombre grande** (a big man). Bueno, malo, primero, tercero drop -o before a
      masculine singular noun: **un buen día**, el primer piso.
    examples:
      - ["Tengo una bicicleta roja.", "I have a red bicycle."]
      - ["Hace buen tiempo.", "The weather is nice.", "bueno → buen"]
      - ["Las calles son estrechas.", "The streets are narrow."]

  - id: possessives
    title: Possessives & demonstratives
    kind: structure
    level: A1
    tags: [possessive, mi, su, este, ese, aquel]
    tables:
      - caption: Possessives (before the noun)
        head: ["", "One thing", "Several things"]
        rows:
          - ["my", "mi casa", "mis casas"]
          - ["your (tú)", "tu casa", "tus casas"]
          - ["his, her, its, their, your (usted)", "su casa", "sus casas"]
          - ["our", "nuestro coche, nuestra casa", "nuestros coches, nuestras casas"]
          - ["your (vosotros)", "vuestro coche, vuestra casa", "vuestros coches, vuestras casas"]
      - caption: Demonstratives
        head: ["", "Masc.", "Fem.", "Neuter (ideas, unknown things)"]
        rows:
          - ["this", "este libro", "esta mesa", "esto"]
          - ["that", "ese libro", "esa mesa", "eso"]
          - ["that over there", "aquel libro", "aquella mesa", "aquello"]
    text: >-
      **Su** can mean his, her, their or your; add de él / de ella / de usted if it's unclear. After the noun there are long
      forms: un amigo **mío** (a friend of mine), **Es mío.** (It's mine.) Plurals: estos, estas, esos, esas, aquellos, aquellas.
    examples:
      - ["Esta es mi hermana.", "This is my sister."]
      - ["¿Qué es eso?", "What's that?"]
      - ["Es un amigo mío.", "He's a friend of mine."]

  - id: questions
    title: Questions & negation
    kind: structure
    level: A1
    tags: [question, questions, negation, no, nada, nadie, nunca]
    tables:
      - head: ["Spanish", "Meaning", "Example"]
        rows:
          - ["qué", "what", "¿Qué quieres? | What do you want?"]
          - ["quién / quiénes", "who", "¿Quién es? | Who is it?"]
          - ["dónde", "where", "¿Dónde está el baño? | Where's the bathroom?"]
          - ["adónde", "where to", "¿Adónde vas? | Where are you going?"]
          - ["de dónde", "where from", "¿De dónde eres? | Where are you from?"]
          - ["cuándo", "when", "¿Cuándo empieza? | When does it start?"]
          - ["por qué", "why", "¿Por qué lo dices? | Why do you say that?"]
          - ["cómo", "how", "¿Cómo te llamas? | What's your name?"]
          - ["cuál / cuáles", "which", "¿Cuál prefieres? | Which do you prefer?"]
          - ["cuánto / cuánta / cuántos / cuántas", "how much / how many", "¿Cuántos años tienes? | How old are you?"]
    text: >-
      Question words carry an accent, and questions open with **¿** (exclamations with **¡**). A yes/no question is just a
      rising tone. Negation: **no** before the verb and before any object pronoun (No lo sé). Double negatives are normal:
      **No veo a nadie** (I don't see anybody); also nada, nunca, tampoco, ninguno.
    examples:
      - ["No quiero nada.", "I don't want anything."]
      - ["Nunca como carne.", "I never eat meat.", "or: No como carne nunca."]
      - ["—No me gusta. —A mí tampoco.", "'I don't like it.' 'Me neither.'"]

  - id: future
    title: ir a + infinitive & the future
    kind: verbs
    level: A1–A2
    tags: [future, futuro, ir a]
    tables:
      - head: ["Person", "ir a + infinitive", "Future: hablar", "Irregular: tener"]
        rows:
          - ["yo", "voy a hablar", "hablar{é}", "tendr{é}"]
          - ["tú", "vas a hablar", "hablar{ás}", "tendr{ás}"]
          - ["él / usted", "va a hablar", "hablar{á}", "tendr{á}"]
          - ["nosotros", "vamos a hablar", "hablar{emos}", "tendr{emos}"]
          - ["vosotros", "vais a hablar", "hablar{éis}", "tendr{éis}"]
          - ["ellos / ustedes", "van a hablar", "hablar{án}", "tendr{án}"]
    text: >-
      **ir a + infinitive** is the everyday way to talk about plans. The future tense adds endings to the whole infinitive,
      and is used for predictions, promises and guesses about now. Irregular stems: tener → **tendr-**, hacer → **har-**,
      poder → **podr-**, salir → **saldr-**, decir → **dir-**, venir → **vendr-**, poner → **pondr-**, saber → **sabr-**.
    examples:
      - ["Voy a estudiar esta noche.", "I'm going to study tonight."]
      - ["Mañana lloverá.", "It will rain tomorrow."]
      - ["Serán las diez.", "It must be about ten o'clock.", "the future for a guess"]

  - id: preterite
    title: Pretérito indefinido (finished past)
    kind: verbs
    level: A2
    tags: [preterite, pretérito, indefinido, past]
    tables:
      - head: ["Person", "hablar", "comer / vivir", "ser / ir", "tener", "hacer"]
        rows:
          - ["yo", "habl{é}", "com{í}", "fui", "tuve", "hice"]
          - ["tú", "habl{aste}", "com{iste}", "fuiste", "tuviste", "hiciste"]
          - ["él / usted", "habl{ó}", "com{ió}", "fue", "tuvo", "hizo"]
          - ["nosotros", "habl{amos}", "com{imos}", "fuimos", "tuvimos", "hicimos"]
          - ["vosotros", "habl{asteis}", "com{isteis}", "fuisteis", "tuvisteis", "hicisteis"]
          - ["ellos / ustedes", "habl{aron}", "com{ieron}", "fueron", "tuvieron", "hicieron"]
    text: >-
      For completed actions at a specific time: ayer, anoche, el lunes, en 2019. **ser** and **ir** share the same forms;
      context tells them apart. More irregulars: estar → estuve, poder → pude, poner → puse, venir → vine,
      decir → dije, querer → quise, saber → supe, dar → di.
    examples:
      - ["Ayer hablé con mi jefe.", "Yesterday I spoke to my boss."]
      - ["Fuimos a la playa el domingo.", "We went to the beach on Sunday."]
      - ["¿Qué hiciste el fin de semana?", "What did you do at the weekend?"]

  - id: imperfect
    title: Pretérito imperfecto (background past)
    kind: verbs
    level: A2
    tags: [imperfect, imperfecto, past, used to]
    tables:
      - head: ["Person", "hablar", "comer / vivir", "ser", "ir", "ver"]
        rows:
          - ["yo", "habl{aba}", "com{ía}", "era", "iba", "veía"]
          - ["tú", "habl{abas}", "com{ías}", "eras", "ibas", "veías"]
          - ["él / usted", "habl{aba}", "com{ía}", "era", "iba", "veía"]
          - ["nosotros", "habl{ábamos}", "com{íamos}", "éramos", "íbamos", "veíamos"]
          - ["vosotros", "habl{abais}", "com{íais}", "erais", "ibais", "veíais"]
          - ["ellos / ustedes", "habl{aban}", "com{ían}", "eran", "iban", "veían"]
    text: >-
      Only three irregular verbs: **ser, ir, ver**. Use it for habits ("used to"), descriptions, background, age and time
      in the past, and actions in progress that get interrupted.
    examples:
      - ["De niño vivía en Lima.", "As a child I lived in Lima."]
      - ["Era tarde y llovía.", "It was late and it was raining.", "background"]
      - ["Siempre íbamos al pueblo en verano.", "We always used to go to the village in summer."]

  - id: pret-vs-imp
    title: Indefinido vs. imperfecto
    kind: contrast
    level: A2–B1
    tags: [preterite, imperfect, past tenses]
    tables:
      - head: ["", "Indefinido", "Imperfecto"]
        rows:
          - ["Role in a story", "what happened: a finished event, the next step", "how things were: background, description, habit, something in progress"]
          - ["Signal words", "ayer, anoche, el lunes, en 2019, de repente, una vez", "siempre, a menudo, todos los días, mientras, de niño"]
          - ["Example", "Sonó el teléfono. | The phone rang.", "Leía un libro. | I was reading a book."]
    text: >-
      Together: **Leía** un libro cuando **sonó** el teléfono (I was reading when the phone rang). Some verbs shift meaning:
      **conocí** (I met) / **conocía** (I knew); **supe** (I found out) / **sabía** (I knew); **quise** (I tried) /
      **quería** (I wanted).
    examples:
      - ["Cuando llegué, todos dormían.", "When I arrived, everyone was asleep."]
      - ["Conocí a Marta en 2018.", "I met Marta in 2018."]
      - ["Antes fumaba, pero lo dejé hace un año.", "I used to smoke, but I quit a year ago."]

  - id: perfect
    title: Pretérito perfecto (he hablado)
    kind: verbs
    level: A2
    tags: [present perfect, perfecto, haber, participle]
    tables:
      - head: ["Person", "haber", "+ participle"]
        rows:
          - ["yo", "he", "hablado | spoken"]
          - ["tú", "has", "comido | eaten"]
          - ["él / usted", "ha", "vivido | lived"]
          - ["nosotros", "hemos", "hecho | done"]
          - ["vosotros", "habéis", "visto | seen"]
          - ["ellos / ustedes", "han", "dicho | said"]
    text: >-
      Participles: -ar → **-ado**, -er / -ir → **-ido**. Irregular: hecho, dicho, visto, escrito, puesto, vuelto, abierto,
      roto, muerto. In Spain it's used for today, this week and "ever"; much of Latin America uses the indefinido instead.
    examples:
      - ["¿Has visto mis llaves?", "Have you seen my keys?"]
      - ["Todavía no he terminado.", "I haven't finished yet."]
      - ["Nunca he estado en Japón.", "I've never been to Japan."]

  - id: por-para
    title: por vs. para
    kind: contrast
    level: A2
    tags: [por, para, prepositions]
    tables:
      - head: ["", "por", "para"]
        rows:
          - ["Core idea", "cause, means, through, exchange, duration", "purpose, destination, recipient, deadline, opinion"]
          - ["Examples", "Gracias por la ayuda. | Thanks for the help. ;; Paseamos por el parque. | We walk through the park.", "Esto es para ti. | This is for you. ;; Estudio para aprender. | I study in order to learn."]
          - ["Time", "por la mañana | in the morning", "para el lunes | by Monday"]
          - ["Fixed phrases", "por favor, por fin, por ejemplo, por eso", "para siempre, para nada"]
    examples:
      - ["Te llamo por teléfono.", "I'll call you on the phone.", "means"]
      - ["Salimos para Madrid mañana.", "We're leaving for Madrid tomorrow.", "destination"]
      - ["Lo compré por diez euros.", "I bought it for ten euros.", "exchange"]
      - ["Para mí, es demasiado caro.", "For me, it's too expensive.", "opinion"]

  - id: commands
    title: Commands (imperative)
    kind: verbs
    level: A2
    tags: [imperative, commands, imperativo]
    tables:
      - head: ["", "hablar", "comer", "Negative"]
        rows:
          - ["tú", "¡Habla!", "¡Come!", "¡No hables! ;; ¡No comas!"]
          - ["usted", "¡Hable!", "¡Coma!", "¡No hable!"]
          - ["vosotros", "¡Hablad!", "¡Comed!", "¡No habléis!"]
          - ["ustedes", "¡Hablen!", "¡Coman!", "¡No hablen!"]
    text: >-
      Irregular tú commands: **di, haz, ve, pon, sal, sé, ten, ven**. Pronouns attach to positive commands (¡Dímelo!) and go
      before negative ones (¡No me lo digas!). A question is often softer: ¿Me pasas la sal?
    examples:
      - ["Ven aquí, por favor.", "Come here, please."]
      - ["No te preocupes.", "Don't worry."]
      - ["Pásame el agua.", "Pass me the water."]

  - id: subjunctive
    title: Present subjunctive
    kind: verbs
    level: B1
    tags: [subjunctive, subjuntivo, que, ojalá, wishes, doubt]
    rule: Take the yo form of the present, drop -o and swap the vowel (-ar → e, -er / -ir → a).
    tables:
      - head: ["Person", "hablar", "comer", "tener", "ser"]
        rows:
          - ["yo", "habl{e}", "com{a}", "teng{a}", "sea"]
          - ["tú", "habl{es}", "com{as}", "teng{as}", "seas"]
          - ["él / usted", "habl{e}", "com{a}", "teng{a}", "sea"]
          - ["nosotros", "habl{emos}", "com{amos}", "teng{amos}", "seamos"]
          - ["vosotros", "habl{éis}", "com{áis}", "teng{áis}", "seáis"]
          - ["ellos / ustedes", "habl{en}", "com{an}", "teng{an}", "sean"]
    text: >-
      Irregular: ser → **sea**, ir → **vaya**, estar → **esté**, saber → **sepa**, haber → **haya**, dar → **dé**. It appears
      in a **que** clause after wishes, requests, feelings and doubt (quiero que…, espero que…, es importante que…,
      no creo que…), after **cuando** about the future, and after **para que, antes de que, ojalá**.
    examples:
      - ["Espero que te guste.", "I hope you like it."]
      - ["Quiero que vengas a la fiesta.", "I want you to come to the party."]
      - ["Cuando tengas tiempo, llámame.", "When you have time, call me.", "cuando about the future → subjunctive"]
      - ["Ojalá haga sol mañana.", "Hopefully it'll be sunny tomorrow."]

  - id: conditional
    title: Conditional & si clauses
    kind: verbs
    level: B1
    tags: [conditional, condicional, si, would, if]
    tables:
      - head: ["Type", "si clause", "Main clause", "Example"]
        rows:
          - ["likely", "si + present", "present, future or command", "Si llueve, me quedo en casa. | If it rains, I stay at home."]
          - ["unlikely or unreal", "si + imperfect subjunctive", "conditional", "Si tuviera dinero, viajaría. | If I had money, I would travel."]
          - ["unreal past", "si + pluperfect subjunctive", "conditional perfect", "Si lo hubiera sabido, habría venido. | If I had known, I would have come."]
    text: >-
      The conditional adds **-ía, -ías, -ía, -íamos, -íais, -ían** to the infinitive, with the same irregular stems as the
      future (tendría, haría, podría). It also makes requests polite: ¿Podrías ayudarme? Me gustaría un café.
    examples:
      - ["Me gustaría ir a Perú.", "I'd like to go to Peru."]
      - ["¿Podría repetirlo, por favor?", "Could you repeat that, please?"]
      - ["Si fuera tú, no lo haría.", "If I were you, I wouldn't do it."]

  - id: comparison
    title: Comparisons
    kind: structure
    level: A2
    tags: [comparative, superlative, más, menos, tan, mejor]
    tables:
      - head: ["Meaning", "Spanish", "Example"]
        rows:
          - ["more … than", "más … que", "Ana es más alta que yo. | Ana is taller than me."]
          - ["less … than", "menos … que", "Este es menos caro. | This one is less expensive."]
          - ["as … as", "tan … como", "Es tan rápido como tú. | He's as fast as you."]
          - ["as much / many as", "tanto / tanta / tantos / tantas … como", "Tengo tantos libros como tú. | I have as many books as you."]
          - ["the most", "el / la / los / las más … (de)", "Es la ciudad más bonita de España. | It's the prettiest city in Spain."]
          - ["very, extremely", "-ísimo", "La comida está riquísima. | The food is delicious."]
    text: >-
      Irregular: bueno → **mejor**, malo → **peor**, grande → **mayor** (older), pequeño → **menor** (younger).
      Before numbers, "more than" is **más de**: más de cien.
    examples:
      - ["Este café es mejor que el otro.", "This coffee is better than the other one."]
      - ["Mi hermano mayor vive en Chile.", "My older brother lives in Chile."]
      - ["Hay más de cien personas.", "There are more than a hundred people."]

  - id: connectors
    title: Connectors
    kind: structure
    level: A2–B1
    tags: [connectors, conjunctions, porque, aunque, así que, sino]
    tables:
      - head: ["Meaning", "Spanish", "Example"]
        rows:
          - ["and / or / but", "y (e before i-), o (u before o-), pero, sino", "No es rojo, sino azul. | It's not red, it's blue."]
          - ["because", "porque; como (at the start)", "Como llovía, no salimos. | As it was raining, we didn't go out."]
          - ["so", "así que, por eso, entonces", "Estaba cansado, así que me fui. | I was tired, so I left."]
          - ["although", "aunque", "Aunque es caro, lo compro. | Although it's expensive, I'll buy it."]
          - ["while, when", "mientras, cuando", "Mientras cocino, escucho la radio. | While I cook, I listen to the radio."]
          - ["first, then, finally", "primero, luego, después, al final", "Primero desayuno y luego salgo. | First I have breakfast and then I go out."]
          - ["however, also", "sin embargo, además, también", "Es caro; sin embargo, vale la pena. | It's expensive; however, it's worth it."]

  - id: numbers-time
    title: Numbers, days & time
