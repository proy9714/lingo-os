          - ["1:00", "Es la una.", "It's one o'clock."]
          - ["3:00", "Son las tres.", "It's three o'clock."]
          - ["3:15", "Son las tres y cuarto.", "It's quarter past three."]
          - ["3:30", "Son las tres y media.", "It's half past three."]
