  - id: confusions
    title: High-value confusions
    kind: contrast
    level: A2–B1
    tags: [confusions, saber, conocer, pedir, preguntar, hay, llevar, traer]
    tables:
      - head: ["Don't confuse", "Difference", "Example"]
        rows:
          - ["saber / conocer", "know facts, know how to vs. be familiar with people and places", "Sé nadar. | I can swim. ;; Conozco Madrid. | I know Madrid."]
          - ["pedir / preguntar", "ask for something vs. ask a question", "Pido la cuenta. | I ask for the bill. ;; Pregunto la hora. | I ask the time."]
          - ["llevar / traer", "take (away from here) vs. bring (to here)", "Llevo el pastel a la fiesta. | I'm taking the cake to the party. ;; Trae el pastel. | Bring the cake."]
          - ["hay / está", "there is (exists) vs. is located (a known thing)", "Hay un banco cerca. | There's a bank nearby. ;; El banco está cerca. | The bank is nearby."]
          - ["tener que / hay que", "someone has to vs. one has to", "Tengo que irme. | I have to go. ;; Hay que reservar. | You need to book."]
          - ["porque / por qué", "because vs. why", "¿Por qué? —Porque sí. | 'Why?' 'Just because.'"]
          - ["sino / pero", "sino corrects a negation; pero adds a contrast", "No es caro, sino barato. | It isn't expensive, it's cheap. ;; Es caro, pero bueno. | It's expensive but good."]
          - ["embarazada / avergonzada", "false friend: pregnant vs. embarrassed", "Estoy embarazada. | I'm pregnant. ;; Estoy avergonzada. | I'm embarrassed."]
          - ["quedar / quedarse", "meet up, be left vs. stay", "Quedamos a las ocho. | Let's meet at eight. ;; Me quedo en casa. | I'm staying at home."]
          - ["tú / usted", "informal vs. formal 'you'", "¿Cómo estás? | How are you? ;; ¿Cómo está usted? | How are you? (formal)"]

  - id: memory-map
    title: One-page memory map
    kind: summary
    level: all
    tags: [summary, overview]
    points:
      - Learn el or la with every noun; -o and -a are a guide, not a rule.
      - The verb ending says who's acting, so the subject pronoun is usually dropped.
      - "ser for what something is; estar for how and where it is."
      - "gustar agrees with the thing you like: me gusta el libro, me gustan los libros."
      - "Object pronouns go before a conjugated verb and attach to infinitives, gerunds and positive commands."
      - ir a + infinitive is the everyday future.
      - "Indefinido tells what happened; imperfecto paints the background."
      - "por looks back at a cause or a route; para looks forward to a purpose or destination."
      - The subjunctive follows que after wishes, feelings and doubt, and cuando about the future.
      - Double negatives are correct in Spanish (no … nada, no … nadie).
    tip: >-
      Listening strategy: catch the verb ending first: it tells you who and when. Then listen for the small words before
      the verb (lo, le, se, me): they tell you to whom.
