# Lingo OS: app settings. Relative paths are resolved from the project root.

# All personal data: database, library, recordings, reports.
# Override with the LINGO_DATA_DIR environment variable.
data_dir: data

server:
  host: 127.0.0.1   # the laptop only; phone sync gets its own listener in Phase 9
  port: 8787

# Languages are added in the app (first run, then Settings → Languages); the catalogue is in
# backend/app/languages/registry.py. Codes listed here are added automatically to a brand-new data folder.
languages: []

defaults:
  daily_goal_minutes: 60

# Optional: the data folder of the Immersion Tracker app, if you used it before.
# `lingo import-tracker` (or Settings → Sync now) reads immersion_log_<lang>.csv and settings.json from it.
# Put your own path in config/app.local.yaml (not committed), for example:
#   immersion_tracker:
#     path: C:/path/to/Language-Immersion/data
immersion_tracker:
  path: null

tracking:
  heartbeat_seconds: 15
  idle_seconds: 90
