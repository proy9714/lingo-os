      - { name: 한겨레, url: "https://www.hani.co.kr/rss/" }
  it:
    searches:
      - "italiano facile {level} {topic}"
      - "comprehensible input Italian {topic}"
      - "imparare l'italiano {level} {topic}"
    topics: [vita quotidiana, viaggi, cucina, storia, cultura, scienza, lavoro]
    feeds:
      - { name: Focus Junior, url: "https://www.focusjunior.it/feed/" }
      - { name: ANSA, url: "https://www.ansa.it/sito/ansait_rss.xml" }
      - { name: Wired Italia, url: "https://www.wired.it/feed/rss" }
