  hi:
    searches:
      - "easy hindi {level} {topic}"
      - "comprehensible input Hindi {topic}"
      - "आसान हिंदी {topic}"
    topics: [रोज़मर्रा की ज़िंदगी, यात्रा, खाना, इतिहास, संस्कृति, विज्ञान, काम]
