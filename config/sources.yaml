# Content discovery (`lingo update-content`, ARCHITECTURE §7). Edit freely; everything is optional.
# YouTube channels also come from the Comprehensible Input Wiki (`lingo sources sync-wiki`, at most weekly).

defaults:
  per_run: 10          # new videos to check per language per run (each one is a request to YouTube)
  articles_per_run: 8  # new articles per language per run (taken from the feeds in turn)
  per_feed: 3          # at most this many from one feed per run
  min_minutes: 3
  max_minutes: 45
  prune_days: 30       # unopened candidates older than this are removed
  keep_bands: [stretch, i_plus_1, comfortable]

languages:
  de:
    searches:          # {level} is your current level (for example B1), {topic} one of the topics below
      - "Deutsch lernen {level} {topic}"
      - "comprehensible input Deutsch {topic}"
      - "Easy German {topic}"
    topics: [Alltag, Reisen, Essen, Geschichte, Wissenschaft, Arbeit, Musik]
    feeds:              # easier sources first; feeds whose articles keep landing off your level are read less often
      - { name: DW Langsam gesprochene Nachrichten, url: "https://rss.dw.com/xml/DKpodcast_lgn_de" }
      - { name: duda.news (Kindernachrichten), url: "https://www.duda.news/feed/" }
      - { name: DW Nachrichten, url: "https://rss.dw.com/xml/rss-de-all" }
      - { name: tagesschau, url: "https://www.tagesschau.de/index~rss2.xml" }
  es:
    searches:
      - "español comprensible {level} {topic}"
      - "aprender español {level} {topic}"
      - "Dreaming Spanish {topic}"
    topics: [viajes, comida, historia, cultura, ciencia, música, vida diaria]
    feeds:
      - { name: Muy Interesante, url: "https://www.muyinteresante.com/feed" }
      - { name: BBC Mundo, url: "https://feeds.bbci.co.uk/mundo/rss.xml" }
      - { name: 20minutos, url: "https://www.20minutos.es/rss/" }
      - { name: El País, url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada" }
  ja:
    searches:
      - "日本語 聴解 {level} {topic}"
      - "comprehensible japanese {topic}"
      - "やさしい日本語 {topic}"
    topics: [旅行, 料理, 日常生活, 歴史, 文化, アニメ, 仕事]
    feeds:
      - { name: 和タのＣ (watanoc, JLPT N5–N4), url: "https://watanoc.com/feed" }
      - { name: MATCHA やさしい日本語, url: "https://matcha-jp.com/easy/feed" }
      - { name: NHKニュース, url: "https://www3.nhk.or.jp/rss/news/cat0.xml" }
  zh:
    searches:
      - "中文 可理解输入 {level} {topic}"
      - "comprehensible input Chinese {topic}"
      - "慢速中文 {topic}"
    topics: [日常生活, 旅行, 美食, 历史, 文化, 科学, 工作]
    feeds:
      - { name: BBC 中文 (简体), url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml" }
      - { name: DW 中文, url: "https://rss.dw.com/rdf/rss-chi-all" }
      - { name: RFI 华语, url: "https://www.rfi.fr/cn/rss" }
      - { name: BBC 中文 (繁體), url: "https://feeds.bbci.co.uk/zhongwen/trad/rss.xml" }
  fr:
    searches:
      - "français facile {level} {topic}"
      - "comprehensible input French {topic}"
      - "apprendre le français {level} {topic}"
    topics: [vie quotidienne, voyages, cuisine, histoire, culture, science, travail]
    feeds:
      - { name: 20 Minutes, url: "https://www.20minutes.fr/feeds/rss-une.xml" }
      - { name: franceinfo, url: "https://www.francetvinfo.fr/titres.rss" }
      - { name: Futura Sciences, url: "https://www.futura-sciences.com/rss/actualites.xml" }
      - { name: RFI, url: "https://www.rfi.fr/fr/rss" }
      - { name: Le Monde, url: "https://www.lemonde.fr/rss/une.xml" }
  pt:
    searches:
      - "português compreensível {level} {topic}"
      - "comprehensible input Portuguese {topic}"
      - "aprender português {level} {topic}"
    topics: [dia a dia, viagens, comida, história, cultura, ciência, trabalho]
    feeds:
      - { name: Ciência Hoje das Crianças, url: "https://chc.org.br/feed/" }
      - { name: Agência Brasil, url: "https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml" }
      - { name: BBC News Brasil, url: "https://feeds.bbci.co.uk/portuguese/rss.xml" }
      - { name: Nexo Jornal, url: "https://www.nexojornal.com.br/rss.xml" }
      - { name: Público (Portugal), url: "https://feeds.feedburner.com/PublicoRSS" }
  ru:
